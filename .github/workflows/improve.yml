name: improve

on:
  schedule:
    # GitHub cannot read the cron string from a variable; edit it here. Daily at 04:17 UTC (off the top of
    # the hour, when scheduled runs are most often delayed). GitHub sometimes drops scheduled runs (it skipped
    # the first one, 2026-11-20 04:17), so two backup times follow; src/ci/due.js makes them no-ops once the
    # day's cycle has run.
    - cron: '17 4 * * *'
    - cron: '17 10 * * *'
    - cron: '17 16 * * *'
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Smoke test: tiny budget on the real model to measure speed and exercise every path. Commits nothing.'
        type: boolean
        default: false
      force:
        description: 'Run a cycle even if every variant already ran today (normally one cycle per UTC day).'
        type: boolean
        default: false

# Never run two cycles at once: they would both read and write state/.
concurrency:
  group: improve
  cancel-in-progress: false

permissions: {}

env:
  # SIC_SMOKE=1 switches config to its `smoke` overlay (tiny budget, state in .smoke/)
  SIC_SMOKE: ${{ inputs.smoke && '1' || '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.SIC_PLAN_TIMEOUT_MINUTES || '5') }}
    permissions:
      contents: read
    env:
      SIC_CONFIG_OVERRIDES: ${{ vars.SIC_CONFIG_OVERRIDES }}
    outputs:
      matrix: ${{ steps.cfg.outputs.matrix }}
      due: ${{ steps.due.outputs.due }}
      finetune_variant: ${{ steps.cfg.outputs.finetune_variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the branch head, not the trigger commit: a run that waited in the queue must see the state the
          # previous run committed
          ref: ${{ github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Variant list from config/default.json
        id: cfg
        run: node src/ci/config-out.js >> "$GITHUB_OUTPUT"
      - name: One cycle per UTC day (backup cron times skip once the day's cycle ran)
        id: due
        env:
          SIC_FORCE: ${{ inputs.force && '1' || '' }}
        run: node src/ci/due.js >> "$GITHUB_OUTPUT"

  finetune:
    # Expert iteration: LoRA-trains the base model on the system's own verified train solutions (from committed
    # state). The dataset is model-written code used as text only; nothing from it is executed. No model server,
    # no push. Settings come from config/default.json via config-out.js.
    needs: plan
    if: ${{ needs.plan.outputs.due == 'true' && needs.plan.outputs.finetune_variant != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.SIC_FINETUNE_TIMEOUT_MINUTES || '180') }}
    permissions:
      contents: read
    env:
      SIC_CONFIG_OVERRIDES: ${{ vars.SIC_CONFIG_OVERRIDES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts
      - name: Read fine-tuning settings
        id: cfg
        run: node src/ci/config-out.js >> "$GITHUB_OUTPUT"
      - name: Cache Python packages and the base model snapshot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.sic-hf
          key: finetune-${{ steps.cfg.outputs.ft_base_revision }}-${{ steps.cfg.outputs.ft_torch_package }}-${{ hashFiles('config/default.json') }}
          restore-keys: finetune-${{ steps.cfg.outputs.ft_base_revision }}-
      - name: Python environment (pinned versions)
        env:
          TORCH_INDEX: ${{ steps.cfg.outputs.ft_torch_index }}
          TORCH_PACKAGE: ${{ steps.cfg.outputs.ft_torch_package }}
          PACKAGES: ${{ steps.cfg.outputs.ft_python_packages }}
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv "$HOME/.sic-venv"
          "$HOME/.sic-venv/bin/pip" install -q --index-url "$TORCH_INDEX" "$TORCH_PACKAGE"
          read -ra pkgs <<< "$PACKAGES"
          "$HOME/.sic-venv/bin/pip" install -q "${pkgs[@]}"
      - name: Base model snapshot (pinned revision)
        env:
          BASE_MODEL: ${{ steps.cfg.outputs.ft_base_model }}
          BASE_REVISION: ${{ steps.cfg.outputs.ft_base_revision }}
        run: |
          "$HOME/.sic-venv/bin/python" -c 'import os; from huggingface_hub import snapshot_download as d; d(os.environ["BASE_MODEL"], revision=os.environ["BASE_REVISION"], local_dir=os.path.expanduser("~/.sic-hf/" + os.environ["BASE_REVISION"]))'
      - name: Adapter converter (pinned commit of the upstream conversion scripts)
        env:
          LLAMA_REPO: ${{ steps.cfg.outputs.ft_llama_repo }}
          LLAMA_COMMIT: ${{ steps.cfg.outputs.ft_llama_commit }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/lora-converter"
          cd "$RUNNER_TEMP/lora-converter"
          git remote add origin "$LLAMA_REPO"
          git sparse-checkout set --no-cone /convert_lora_to_gguf.py /convert_hf_to_gguf.py /gguf-py/
          git fetch -q --depth=1 --filter=blob:none origin "$LLAMA_COMMIT"
          git checkout -q FETCH_HEAD
      - name: Build the training set from verified solutions (holdout excluded)
        env:
          VARIANT: ${{ steps.cfg.outputs.finetune_variant }}
          BASE_REVISION: ${{ steps.cfg.outputs.ft_base_revision }}
        run: node src/finetune/prepare.js "--variant=$VARIANT" "--out=$RUNNER_TEMP/ft" "--base-dir=$HOME/.sic-hf/$BASE_REVISION"
      - name: LoRA training (CPU, time-limited)
        env:
          SETTINGS: ${{ steps.cfg.outputs.ft_settings_file }}
        run: |
          set -o pipefail
          "$HOME/.sic-venv/bin/python" tools/finetune/train.py --settings "$RUNNER_TEMP/ft/$SETTINGS" 2>&1 | grep -v -i 'warn'
      - name: Convert the adapter to GGUF for Ollama
        env:
          BASE_REVISION: ${{ steps.cfg.outputs.ft_base_revision }}
          OUT_TYPE: ${{ steps.cfg.outputs.ft_out_type }}
          ADAPTER_DIR: ${{ steps.cfg.outputs.ft_adapter_dir }}
          ADAPTER_GGUF: ${{ steps.cfg.outputs.ft_adapter_gguf }}
        run: |
          PYTHONPATH="$RUNNER_TEMP/lora-converter/gguf-py" "$HOME/.sic-venv/bin/python" "$RUNNER_TEMP/lora-converter/convert_lora_to_gguf.py" \
            --base "$HOME/.sic-hf/$BASE_REVISION" --outtype "$OUT_TYPE" --outfile "$RUNNER_TEMP/ft/$ADAPTER_GGUF" "$RUNNER_TEMP/ft/$ADAPTER_DIR"
      - name: Upload the adapter for the variant's evaluation job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.cfg.outputs.ft_artifact }}
          path: |
            ${{ runner.temp }}/ft/${{ steps.cfg.outputs.ft_adapter_gguf }}
            ${{ runner.temp }}/ft/${{ steps.cfg.outputs.ft_manifest_file }}
            ${{ runner.temp }}/ft/${{ steps.cfg.outputs.ft_metrics_file }}
          retention-days: ${{ steps.cfg.outputs.artifact_retention_days }}
          if-no-files-found: error

  improve:
    # Runs LLM-written code. Its token can only read this (public) repo; it cannot push.
    # Waits for the fine-tuning job (the fine-tuned variant needs its adapter); the other variants run even if
    # fine-tuning fails or is skipped.
    needs: [plan, finetune]
    if: ${{ !cancelled() && needs.plan.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.SIC_IMPROVE_TIMEOUT_MINUTES || '170') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.SIC_MAX_PARALLEL || '7') }}
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      SIC_CONFIG_OVERRIDES: ${{ vars.SIC_CONFIG_OVERRIDES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the branch head, not the trigger commit: a run that waited in the queue must see the state the
          # previous run committed
          ref: ${{ github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Read runtime settings from config/default.json
        id: cfg
        env:
          VARIANT: ${{ matrix.variant }}
        run: node src/ci/config-out.js "--variant=$VARIANT" >> "$GITHUB_OUTPUT"

      - name: Cache Ollama binary and model weights
        if: steps.cfg.outputs.provider == 'openai-compatible'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.sic-ollama
            ~/.ollama/models
          key: ollama-${{ steps.cfg.outputs.ollama_version }}-${{ steps.cfg.outputs.model }}

      - name: Cache mutation curriculum (pinned repo, dev packages, generated tasks)
        if: steps.cfg.outputs.track == 'mutation'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cfg.outputs.curriculum_cache }}
          key: curriculum-${{ hashFiles('config/default.json', 'src/mutate/**') }}

      - name: Install and start Ollama, pull the model, check it answers
        if: steps.cfg.outputs.provider == 'openai-compatible'
        env:
          OLLAMA_URL: ${{ steps.cfg.outputs.ollama_url }}
          OLLAMA_HOST: ${{ steps.cfg.outputs.ollama_host }}
          MODEL: ${{ steps.cfg.outputs.model }}
          READY_TIMEOUT: ${{ steps.cfg.outputs.ollama_ready_timeout }}
          RETRIES: ${{ steps.cfg.outputs.setup_retries }}
          RETRY_DELAY: ${{ steps.cfg.outputs.setup_retry_delay }}
          WARMUP_TIMEOUT: ${{ steps.cfg.outputs.warmup_timeout }}
          WARMUP_TOKENS: ${{ steps.cfg.outputs.warmup_tokens }}
          # Ollama silently truncates prompts beyond its context window; mutation-track prompts are long.
          OLLAMA_CONTEXT_LENGTH: ${{ steps.cfg.outputs.ollama_context_length }}
        run: |
          set -euo pipefail
          # retry CMD...: up to $RETRIES tries, waiting RETRY_DELAY x attempt seconds between them
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge "$RETRIES" ]; then return 1; fi
              echo "attempt $n failed, retrying in $((RETRY_DELAY * n))s: $1"
              sleep $((RETRY_DELAY * n))
              n=$((n + 1))
            done
          }
          download() {
            curl -fsSL "$OLLAMA_URL" -o "$RUNNER_TEMP/ollama.tar.zst" &&
              zstd -dc "$RUNNER_TEMP/ollama.tar.zst" | tar -x -C "$HOME/.sic-ollama"
          }
          fail() {
            echo "::error::$1"
            tail -n 50 "$RUNNER_TEMP/ollama.log" || true
            exit 1
          }
          if [ ! -x "$HOME/.sic-ollama/bin/ollama" ]; then
            mkdir -p "$HOME/.sic-ollama"
            retry download || fail "could not download Ollama from $OLLAMA_URL"
          fi
          nohup "$HOME/.sic-ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          ready=0
          for _ in $(seq "$READY_TIMEOUT"); do
            if curl -fsS "http://$OLLAMA_HOST/api/version" > /dev/null; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || fail "Ollama did not start within ${READY_TIMEOUT}s"
          retry "$HOME/.sic-ollama/bin/ollama" pull "$MODEL" || fail "could not pull model $MODEL"
          # Warm-up: load the weights and prove the model answers before the cycle spends its budget.
          body=$(printf '{"model":"%s","prompt":"Reply OK","stream":false,"options":{"num_predict":%s}}' "$MODEL" "$WARMUP_TOKENS")
          retry curl -fsS --max-time "$WARMUP_TIMEOUT" "http://$OLLAMA_HOST/api/generate" -d "$body" -o /dev/null ||
            fail "model $MODEL did not answer a warm-up request"
          echo "Ollama ready, $MODEL answers"

      - name: Download the fine-tuned adapter
        if: steps.cfg.outputs.finetune == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.cfg.outputs.ft_artifact }}
          path: ${{ runner.temp }}/ft

      - name: Serve the fine-tuned model (same base weights + LoRA adapter)
        if: steps.cfg.outputs.finetune == 'true' && steps.cfg.outputs.provider == 'openai-compatible'
        env:
          OLLAMA_HOST: ${{ steps.cfg.outputs.ollama_host }}
          BASE: ${{ steps.cfg.outputs.model }}
          FT_MODEL: ${{ steps.cfg.outputs.variant_model }}
          ADAPTER_GGUF: ${{ steps.cfg.outputs.ft_adapter_gguf }}
          WARMUP_TIMEOUT: ${{ steps.cfg.outputs.warmup_timeout }}
          WARMUP_TOKENS: ${{ steps.cfg.outputs.warmup_tokens }}
        run: |
          set -euo pipefail
          printf 'FROM %s\nADAPTER %s\n' "$BASE" "$RUNNER_TEMP/ft/$ADAPTER_GGUF" > "$RUNNER_TEMP/Modelfile"
          "$HOME/.sic-ollama/bin/ollama" create "$FT_MODEL" -f "$RUNNER_TEMP/Modelfile"
          body=$(printf '{"model":"%s","prompt":"Reply OK","stream":false,"options":{"num_predict":%s}}' "$FT_MODEL" "$WARMUP_TOKENS")
          curl -fsS --max-time "$WARMUP_TIMEOUT" "http://$OLLAMA_HOST/api/generate" -d "$body" -o /dev/null ||
            { echo "::error::fine-tuned model $FT_MODEL did not answer"; tail -n 50 "$RUNNER_TEMP/ollama.log" || true; exit 1; }
          echo "$FT_MODEL ready"

      - name: Record what the fine-tuning job did
        if: steps.cfg.outputs.finetune == 'true'
        env:
          VARIANT: ${{ matrix.variant }}
        run: node src/finetune/record.js "--variant=$VARIANT" "--dir=$RUNNER_TEMP/ft"

      - name: Run one improvement cycle
        env:
          VARIANT: ${{ matrix.variant }}
        run: node src/run.js "--variant=$VARIANT"

      - name: Job summary (timing and budget projection)
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
        run: node src/ci/step-summary.js "--variant=$VARIANT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload this variant's state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.cfg.outputs.artifact_prefix }}-${{ matrix.variant }}
          path: ${{ steps.cfg.outputs.variant_state_dir }}/
          retention-days: ${{ steps.cfg.outputs.artifact_retention_days }}
          if-no-files-found: error

  aggregate:
    # Read-only: merges the variants' state, builds charts, REPORT.md, README block and the dashboard.
    # It runs this repo's own scripts on the artifacts as data; nothing from the artifacts is executed.
    needs: [plan, improve]
    if: ${{ !cancelled() && !inputs.smoke && needs.plan.outputs.due == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.SIC_AGGREGATE_TIMEOUT_MINUTES || '15') }}
    permissions:
      contents: read
    env:
      SIC_CONFIG_OVERRIDES: ${{ vars.SIC_CONFIG_OVERRIDES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the branch head, not the trigger commit: a run that waited in the queue must see the state the
          # previous run committed
          ref: ${{ github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read settings
        id: cfg
        run: node src/ci/config-out.js >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ steps.cfg.outputs.artifact_prefix }}-*
          path: ${{ runner.temp }}/variants
      - name: Merge variant state
        run: node src/ci/collect.js "$RUNNER_TEMP/variants"
      - name: Charts, report, README block, dashboard
        run: |
          node src/chart.js
          node src/report.js --update-readme
          node site/build.js
      - name: Upload files to commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.cfg.outputs.publish_artifact }}
          path: |
            ${{ steps.cfg.outputs.state_dir }}/
            chart*.svg
            REPORT.md
            README.md
          retention-days: ${{ steps.cfg.outputs.artifact_retention_days }}
          if-no-files-found: error
      - name: Upload dashboard for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.cfg.outputs.site_dir }}
    outputs:
      publish_artifact: ${{ steps.cfg.outputs.publish_artifact }}
      state_dir: ${{ steps.cfg.outputs.state_dir }}

  commit:
    # Can push, but never runs anything from the artifacts: it only copies files.
    needs: aggregate
    if: ${{ !cancelled() && needs.aggregate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.SIC_COMMIT_TIMEOUT_MINUTES || '10') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.aggregate.outputs.publish_artifact }}
          path: ${{ runner.temp }}/publish

      - name: Copy state, charts and reports into the repo (data only)
        env:
          STATE_DIR: ${{ needs.aggregate.outputs.state_dir }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/publish"
          if [ -n "$(find "$src" -type l)" ]; then echo "::error::artifact contains symlinks"; exit 1; fi
          test -d "$src/$STATE_DIR"
          rm -rf "$STATE_DIR"
          cp -R "$src/$STATE_DIR" "$STATE_DIR"
          for f in "$src"/chart*.svg "$src/REPORT.md" "$src/README.md"; do cp "$f" .; done

      - name: Commit and push
        env:
          STATE_DIR: ${{ needs.aggregate.outputs.state_dir }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$STATE_DIR" chart*.svg REPORT.md README.md
          if git diff --cached --quiet; then echo "No state changes."; exit 0; fi
          git commit -m "state: improvement cycle (run ${GITHUB_RUN_ID})"
          for _ in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase
          done
          exit 1

  pages:
    # Publishes the static dashboard. Needs Settings -> Pages -> Source: GitHub Actions.
    needs: [aggregate, commit]
    if: ${{ !cancelled() && needs.aggregate.result == 'success' && needs.commit.result == 'success' && vars.SIC_PAGES != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(vars.SIC_PAGES_TIMEOUT_MINUTES || '10') }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Optional: if Pages is not enabled yet, warn instead of marking a successful training run as failed.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Pages not deployed
        if: steps.deploy.outcome == 'failure'
        run: echo "::warning::Dashboard not published. Enable it in Settings -> Pages -> Source -> GitHub Actions (or set the repo variable SIC_PAGES=off). Training results were committed normally."
